        let salvar = json!({ "ts": mrdesk_agora(), "lista": lista });\n                LocalConfig::set_option(MRDESK_LISTA_CHAVE.to_owned(), salvar.to_string());\n            }\n        }\n    }\n}\n\npub fn mrdesk_tecnico_na_lista(peer_id: &str) -> bool {\n    use sha2::{Digest, Sha256};\n    let (ts, lista) = mrdesk_lista_salva();\n    if ts == 0 || mrdesk_agora().saturating_sub(ts) >= MRDESK_LISTA_VALIDADE {\n        return false;\n    }\n    let mut h = Sha256::new();\n    h.update(format!("{}:{}", Config::get_id(), peer_id).as_bytes());\n    let codigo: String = h.finalize().iter().map(|b| format!("{:02x}", b)).collect();\n    lista.iter().any(|x| x == &codigo)\n}\n'
