name: Custom Windows Client Generator
run-name: Custom Windows Client Generator
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'version to buld'
        required: true
        default: ''
        type: string
      zip_url:
        description: 'url to zip of json'
        required: true
        default: ''
        type: string


env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5" 
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2024.07.12
  VCPKG_COMMIT_ID: "${{ inputs.version == 'master' && '9e593bb18ea69cc5095e012465dcd675a822ed0d' || '120deac3062162151622ca4860575a33844ba10b' }}"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  VERSION: "${{ inputs.version }}"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"
  STATUS_URL: "${{ secrets.GENURL }}/updategh"


jobs:
  setup:
    uses: ./.github/workflows/fetch-encrypted-secrets.yml
    with:
      zip_url_json: ${{ inputs.zip_url }}

  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ inputs.version }}

  build-RustDeskTempTopMostWindow:
    needs: setup
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    secrets: inherit
    strategy:
      fail-fast: false

  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge, setup]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              vcpkg-triplet: x64-windows-static,
            }
          # - { target: aarch64-pc-windows-msvc, os: windows-2022, arch: aarch64 }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - uses: actions/download-artifact@v4
        with:
          name: encrypted-secrets-zip

      - name: Load Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}

      - name: Finalize and Cleanup zip/json
        if: always() # Run even if previous steps fail
        continue-on-error: true
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ secrets.GENURL }}/cleanzip"
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json"}'
          data: '{"uuid": "${{ env.uuid }}"}'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      
      - name: Set rdgen value
        if: ${{ env.rdgen == 'true' }}
        run: |
          echo "STATUS_URL=${{ secrets.GENURL }}/updategh" >> $env:GITHUB_ENV

      - name: Set rdgen value
        if: ${{ env.rdgen == 'false' }}
        run: |
          echo "STATUS_URL=${{ env.apiServer }}/api/updategh" >> $env:GITHUB_ENV

      - name: Checkout source code
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Checkout source code
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: fix flutter_gpu_texture_renderer (fixed in master rustdesk)
        shell: bash
        run: |
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml

      - name: patch common.rs to report install status in sysinfo (MrDesk custom)
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("src/common.rs")
          s = p.read_text()
          old = (
              '    #[cfg(not(any(target_os = "android", target_os = "ios")))]\n'
              '    {\n'
              '        let username = crate::platform::get_active_username();\n'
              '        if !username.is_empty() && (!cfg!(windows) || username != "SYSTEM") {\n'
              '            out["username"] = json!(username);\n'
              '        }\n'
              '    }\n'
              '    out\n'
              '}'
          )
          new = (
              '    #[cfg(not(any(target_os = "android", target_os = "ios")))]\n'
              '    {\n'
              '        let username = crate::platform::get_active_username();\n'
              '        if !username.is_empty() && (!cfg!(windows) || username != "SYSTEM") {\n'
              '            out["username"] = json!(username);\n'
              '        }\n'
              '        out["installed"] = json!(if crate::platform::is_installed() { "S" } else { "N" });\n'
              '    }\n'
              '    out\n'
              '}'
          )
          if old not in s:
              raise SystemExit(
                  "ERRO: bloco esperado nao encontrado em src/common.rs - "
                  "o RustDesk oficial pode ter mudado essa funcao (get_sysinfo). "
                  "Atualize o patch em generator-windows.yml."
              )
          s = s.replace(old, new, 1)
          p.write_text(s)
          print("common.rs patched: campo 'installed' adicionado ao get_sysinfo()")
          PYEOF

      - name: patch windows.rs to set service description (MrDesk custom)
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("src/platform/windows.rs")
          s = p.read_text()

          # Localiza pela funcao (nao pelo bloco inteiro, que tem escaping
          # aninhado demais pra manter em um literal old/new) e insere a
          # linha "sc description" logo antes do "sc start" que pertence a
          # essa funcao especificamente (ha outro "sc start {app_name}" em
          # get_import_config, mais acima no arquivo).
          fn_marker = "fn get_create_service(exe: &str) -> String {"
          fn_idx = s.find(fn_marker)
          if fn_idx == -1:
              raise SystemExit(
                  "ERRO: funcao get_create_service nao encontrada em src/platform/windows.rs - "
                  "o RustDesk oficial pode ter mudado essa funcao. Atualize o patch em generator-windows.yml."
              )

          target = "sc start {app_name}"
          target_idx = s.find(target, fn_idx)
          if target_idx == -1:
              raise SystemExit(
                  "ERRO: linha 'sc start {app_name}' nao encontrada dentro de get_create_service - "
                  "o RustDesk oficial pode ter mudado essa funcao. Atualize o patch em generator-windows.yml."
              )

          insertion = (
              'sc description {app_name} \\"Suporte remoto Sysrs para atualizacao do Sistema '
              'de Gestao Empresarial MR1/MRE\\"\n'
          )
          s = s[:target_idx] + insertion + s[target_idx:]
          p.write_text(s)
          print("windows.rs patched: 'sc description' adicionado ao get_create_service()")
          PYEOF

      - name: patch ui_cm_interface.rs to allow Elevate even when installed as service (MrDesk custom - TESTE)
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("src/ui_cm_interface.rs")
          s = p.read_text()

          # can_elevate() normalmente retorna "!is_installed()", ou seja, o botao
          # "Elevate" da janela de Permissoes so funciona em modo portatil (nao
          # instalado). No MrDesk (instalado como servico), isso bloqueia o
          # unico caminho nativo do RustDesk pra alcancar janelas elevadas
          # (como a propria tela de Configuracoes) durante uma sessao remota.
          # Este patch faz can_elevate() sempre retornar true no Windows,
          # independente de estar instalado - EM TESTE, a confirmar se resolve
          # o problema de acesso as Configuracoes remotamente.
          fn_marker = "pub fn can_elevate() -> bool {"
          fn_idx = s.find(fn_marker)
          if fn_idx == -1:
              raise SystemExit(
                  "ERRO: funcao can_elevate nao encontrada em src/ui_cm_interface.rs - "
                  "o RustDesk oficial pode ter mudado essa funcao. Atualize o patch em generator-windows.yml."
              )

          target = "return !crate::platform::is_installed();"
          target_idx = s.find(target, fn_idx)
          if target_idx == -1:
              raise SystemExit(
                  "ERRO: linha 'return !crate::platform::is_installed();' nao encontrada dentro de can_elevate - "
                  "o RustDesk oficial pode ter mudado essa funcao. Atualize o patch em generator-windows.yml."
              )

          insertion = "return true; // MrDesk custom: permite Elevate mesmo instalado como servico\n    "
          s = s[:target_idx] + insertion + s[target_idx + len(target):]
          p.write_text(s)
          print("ui_cm_interface.rs patched: can_elevate() sempre retorna true no Windows")
          PYEOF

      - name: patch native software-update check to use MrDesk's own server (MrDesk custom)
        shell: bash
        run: |
          # O RustDesk original manda um POST fixo pra https://api.rustdesk.com/version/latest
          # pra saber se ha uma versao nova, e essa checagem inteira e desligada de proposito
          # para builds "custom client" como o MrDesk (is_custom_client() == true). Aqui a
          # gente: (1) troca a URL fixa pelo nosso proprio endpoint, e (2) reativa a checagem
          # (manual e a automatica diaria em segundo plano) especificamente pro MrDesk. O
          # endpoint (mrdesk-suporte /api/version/latest) e quem decide se ha versao nova.
          set -e

          python3 - <<'PYEOF'
          import pathlib

          # 1) URL fixa do check -> nosso servidor
          p = pathlib.Path("libs/hbb_common/src/lib.rs")
          s = p.read_text()
          target = 'const URL: &str = "https://api.rustdesk.com/version/latest";'
          if target not in s:
              raise SystemExit(
                  "ERRO: URL de version_check_request nao encontrada em libs/hbb_common/src/lib.rs - "
                  "o RustDesk oficial pode ter mudado essa funcao. Atualize o patch em generator-windows.yml."
              )
          s = s.replace(target, 'const URL: &str = "https://mrdesk.sysrs.com.br/api/version/latest";', 1)
          p.write_text(s)
          print("hbb_common/src/lib.rs patched: URL do version check aponta pro nosso servidor")

          # 2) Reativa a checagem manual (desligada de proposito pra custom client)
          p = pathlib.Path("src/common.rs")
          s = p.read_text()
          target = "pub fn check_software_update() {\n    if is_custom_client() {\n        return;\n    }"
          if target not in s:
              raise SystemExit(
                  "ERRO: guarda is_custom_client() em check_software_update() nao encontrada em src/common.rs - "
                  "o RustDesk oficial pode ter mudado essa funcao. Atualize o patch em generator-windows.yml."
              )
          replacement = "pub fn check_software_update() {\n    // MrDesk custom: checagem reativada, aponta pro nosso proprio servidor."
          s = s.replace(target, replacement, 1)
          p.write_text(s)
          print("common.rs patched: check_software_update() reativado para o MrDesk")

          # 3) Reativa a checagem automatica diaria em segundo plano (Windows)
          p = pathlib.Path("src/updater.rs")
          s = p.read_text()
          target = "let update_msi = crate::platform::is_msi_installed()? && !crate::is_custom_client();"
          if target not in s:
              raise SystemExit(
                  "ERRO: linha 'update_msi' nao encontrada em src/updater.rs - "
                  "o RustDesk oficial pode ter mudado essa funcao. Atualize o patch em generator-windows.yml."
              )
          replacement = "let update_msi = crate::platform::is_msi_installed()?; // MrDesk custom: checagem automatica diaria reativada"
          s = s.replace(target, replacement, 1)
          p.write_text(s)
          print("updater.rs patched: checagem automatica diaria reativada para o MrDesk")

          # 4) A tela principal do Flutter tem seu PROPRIO bloqueio pra esconder o card de
          #    "nova versao disponivel" quando e um "custom client" (bind.isCustomClient())
          #    OU quando o prefixo de URI do app (ex.: "mrdesk://") nao contem "rustdesk".
          #    Sem tirar esse bloqueio, o card nunca aparece pro MrDesk mesmo com o
          #    servidor respondendo certinho.
          p = pathlib.Path("flutter/lib/desktop/pages/desktop_home_page.dart")
          s = p.read_text()
          target = (
              "if (!bind.isCustomClient() &&\n"
              "        updateUrl.isNotEmpty &&\n"
              "        !isCardClosed &&\n"
              "        bind.mainUriPrefixSync().contains('rustdesk')) {"
          )
          if target not in s:
              raise SystemExit(
                  "ERRO: condicao do card 'nova versao disponivel' nao encontrada em "
                  "flutter/lib/desktop/pages/desktop_home_page.dart - o RustDesk oficial pode ter "
                  "mudado essa tela. Atualize o patch em generator-windows.yml."
              )
          replacement = "if (updateUrl.isNotEmpty && !isCardClosed) { // MrDesk custom: card de update habilitado"
          s = s.replace(target, replacement, 1)
          p.write_text(s)
          print("desktop_home_page.dart patched: card de nova versao habilitado para custom client")

          # 5) Na inicializacao da interface, checkUpdate() (flutter/lib/common.dart) so
          #    registra o evento que preenche stateGlobal.updateUrl, e so pede a checagem
          #    ao Rust, quando NAO e custom client. Sem tirar essa trava, a tela nunca
          #    pergunta nada ao servidor e o card do item 4 fica sempre vazio (a checagem
          #    que aparece no log vem so do atualizador em segundo plano do servico).
          p = pathlib.Path("flutter/lib/common.dart")
          s = p.read_text()
          target = (
              "void checkUpdate() {\n"
              "  if (!isWeb) {\n"
              "    if (!bind.isCustomClient()) {"
          )
          if target not in s:
              raise SystemExit(
                  "ERRO: trava isCustomClient() em checkUpdate() nao encontrada em "
                  "flutter/lib/common.dart - o RustDesk oficial pode ter mudado essa funcao. "
                  "Atualize o patch em generator-windows.yml."
              )
          replacement = (
              "void checkUpdate() {\n"
              "  if (!isWeb) {\n"
              "    if (true) { // MrDesk custom: checagem de update na interface habilitada"
          )
          s = s.replace(target, replacement, 1)
          p.write_text(s)
          print("common.dart patched: checkUpdate() da interface habilitado para custom client")

          # 6) (Item 19) Foco do teclado ao voltar pra janela da sessao (Alt+Tab, barra de
          #    tarefas...). No Windows, onWindowBlur() tira o foco do teclado da tela remota,
          #    mas onWindowFocus() so devolve no "modo de mouse relativo" - no uso normal o
          #    teclado so voltava depois de clicar dentro da tela remota. Aqui devolvemos o
          #    foco ao voltar pra janela, so na aba visivel (varias sessoes em abas).
          p = pathlib.Path("flutter/lib/desktop/pages/remote_page.dart")
          s = p.read_text()
          target = (
              "    stateGlobal.isFocused.value = true;\n"
              "\n"
              "    // Restore relative mouse mode constraints when window regains focus.\n"
          )
          if s.count(target) != 1:
              raise SystemExit(
                  "ERRO: trecho de onWindowFocus() nao encontrado em "
                  "flutter/lib/desktop/pages/remote_page.dart - o RustDesk oficial pode ter "
                  "mudado essa funcao. Atualize o patch 6 em generator-windows.yml."
              )
          replacement = (
              "    stateGlobal.isFocused.value = true;\n"
              "\n"
              "    // MrDesk custom: devolve o teclado para a tela remota ao voltar para a janela\n"
              "    if (isWindows && !_rawKeyFocusNode.hasFocus) {\n"
              "      final mrdeskTabs = widget.tabController?.state.value;\n"
              "      final mrdeskAbaVisivel = mrdeskTabs == null ||\n"
              "          mrdeskTabs.tabs.isEmpty ||\n"
              "          mrdeskTabs.selected >= mrdeskTabs.tabs.length ||\n"
              "          mrdeskTabs.selectedTabInfo.key == widget.id;\n"
              "      if (mrdeskAbaVisivel) {\n"
              "        _rawKeyFocusNode.requestFocus();\n"
              "      }\n"
              "    }\n"
              "\n"
              "    // Restore relative mouse mode constraints when window regains focus.\n"
          )
          s = s.replace(target, replacement, 1)
          p.write_text(s)
          print("remote_page.dart patched: foco do teclado volta pra tela remota ao ativar a janela")

          # 7) (Item 16) Junto com o heartbeat (a cada ~15 s), manda ha quantos segundos o
          #    teclado/mouse estao parados ("mrdesk_ocioso"), pro painel mostrar
          #    "sem uso ha X min". GetLastInputInfo so vale na sessao do usuario - o
          #    heartbeat sai do processo --server, que o servico abre na sessao do usuario.
          #    Manda so o tempo parado, nada do que e digitado.
          p = pathlib.Path("src/hbbs_http/sync.rs")
          s = p.read_text()
          target = '                v["modified_at"] = json!(modified_at);\n'
          if s.count(target) != 1:
              raise SystemExit(
                  "ERRO: linha do heartbeat (modified_at) nao encontrada em "
                  "src/hbbs_http/sync.rs - o RustDesk oficial pode ter mudado o heartbeat. "
                  "Atualize o patch 7 em generator-windows.yml."
              )
          replacement = (
              target
              + "                // MrDesk custom (item 16): tempo sem uso de teclado/mouse\n"
              + "                #[cfg(windows)]\n"
              + "                {\n"
              + "                    if let Some(ocioso) = mrdesk_segundos_ocioso() {\n"
              + '                        v["mrdesk_ocioso"] = json!(ocioso);\n'
              + "                    }\n"
              + "                }\n"
          )
          s = s.replace(target, replacement, 1)
          s += (
              "\n"
              "// MrDesk custom (item 16): segundos desde o ultimo uso de teclado/mouse na sessao\n"
              "#[cfg(windows)]\n"
              "fn mrdesk_segundos_ocioso() -> Option<u64> {\n"
              "    #[link(name = \"kernel32\")]\n"
              "    extern \"system\" {\n"
              "        fn GetTickCount() -> u32;\n"
              "    }\n"
              "    use winapi::um::winuser::{GetLastInputInfo, LASTINPUTINFO};\n"
              "    unsafe {\n"
              "        let mut lii = LASTINPUTINFO {\n"
              "            cbSize: std::mem::size_of::<LASTINPUTINFO>() as u32,\n"
              "            dwTime: 0,\n"
              "        };\n"
              "        if GetLastInputInfo(&mut lii) == 0 {\n"
              "            return None;\n"
              "        }\n"
              "        Some((GetTickCount().wrapping_sub(lii.dwTime) / 1000) as u64)\n"
              "    }\n"
              "}\n"
          )
          p.write_text(s)
          print("sync.rs patched: heartbeat manda tempo sem uso de teclado/mouse (mrdesk_ocioso)")

          # 8) (Item 6A + 23) Controle de tecnicos autorizados, no ponto em que o MrDesk recebe
          #    o pedido de login (src/server/connection.rs, on_message/LoginRequest), ANTES
          #    de validar a senha. Vale pra todos os tipos de acesso e nos dois builds.
          #    Consulta POST /api/tecnicos/verificar {"id", "peer"} -> {"autorizado": bool},
          #    espera maxima 5 s; servidor sem resposta -> lista guardada (patch 10).
          #    Bloqueio/falha: mensagem pra quem conecta + auditoria com "permissao" B/F.
          p = pathlib.Path("src/server/connection.rs")
          s = p.read_text()
          target = (
              "        if let Some(message::Union::LoginRequest(lr)) = msg.union {\n"
              "            self.handle_login_request_without_validation(&lr).await;\n"
              "            if self.authorized {\n"
              "                return true;\n"
              "            }\n"
          )
          if s.count(target) != 1:
              raise SystemExit(
                  "ERRO: inicio do tratamento de LoginRequest nao encontrado em "
                  "src/server/connection.rs - o RustDesk oficial pode ter mudado o login. "
                  "Atualize o patch 8 em generator-windows.yml."
              )
          s = s.replace(target, target + '            // MrDesk custom (item 6A): so MrDeskPro de tecnico autorizado conecta\n            match mrdesk_verificar_tecnico(&self.lr.my_id).await {\n                MrdeskPermissao::Permitida => {}\n                MrdeskPermissao::Bloqueada => {\n                    log::warn!("MrDesk: conexao bloqueada, tecnico nao autorizado: {}", self.lr.my_id);\n                    self.post_conn_audit(json!({"peer": ((&self.lr.my_id, &self.lr.my_name)), "permissao": "B"}));\n                    self.send_login_error(MRDESK_MSG_BLOQUEADA).await;\n                    sleep(1.).await;\n                    return false;\n                }\n                MrdeskPermissao::Falha => {\n                    log::warn!("MrDesk: nao foi possivel verificar o tecnico {} (servidor fora, fora da lista guardada)", self.lr.my_id);\n                    self.post_conn_audit(json!({"peer": ((&self.lr.my_id, &self.lr.my_name)), "permissao": "F"}));\n                    self.send_login_error(MRDESK_MSG_FALHA).await;\n                    sleep(1.).await;\n                    return false;\n                }\n            }\n', 1)
          s += '\n// ================================================================\n// MrDesk custom (item 6A + 23): controle de tecnicos autorizados.\n// Antes de validar a senha, pergunta ao servidor da Sysrs se o ID de quem\n// esta conectando (MrDeskPro) esta autorizado. Se o servidor nao responder,\n// usa a lista de tecnicos guardada neste computador (item 23, atualizada 1x por\n// dia e a cada acesso; vale 15 dias) - ver hbbs_http/sync.rs.\n// ================================================================\nenum MrdeskPermissao {\n    Permitida,\n    Bloqueada,\n    Falha,\n}\n\nconst MRDESK_MSG_BLOQUEADA: &str = "Conex\\u{e3}o n\\u{e3}o permitida por regras de seguran\\u{e7}a da Sysrs.";\nconst MRDESK_MSG_FALHA: &str = "N\\u{e3}o foi poss\\u{ed}vel verificar a autoriza\\u{e7}\\u{e3}o: servidor da Sysrs fora do ar. Tente novamente em instantes.";\n\nasync fn mrdesk_verificar_tecnico(peer_id: &str) -> MrdeskPermissao {\n    let base = crate::get_api_server(\n        Config::get_option("api-server"),\n        Config::get_option("custom-rendezvous-server"),\n    );\n    let mut resposta: Option<bool> = None;\n    if !base.is_empty() {\n        let url = format!("{}/api/tecnicos/verificar", base);\n        let body = json!({ "id": Config::get_id(), "peer": peer_id }).to_string();\n        if let Ok(Ok(texto)) = hbb_common::tokio::time::timeout(\n            std::time::Duration::from_secs(5),\n            crate::post_request(url, body, ""),\n        )\n        .await\n        {\n            resposta = serde_json::from_str::<Value>(&texto)\n                .ok()\n                .and_then(|v| v.get("autorizado").and_then(|a| a.as_bool()));\n        }\n    }\n    match resposta {\n        Some(autorizado) => {\n            // servidor no ar: aproveita e renova a lista guardada (em segundo plano)\n            hbb_common::tokio::spawn(crate::hbbs_http::sync::mrdesk_atualizar_lista(true));\n            if autorizado {\n                MrdeskPermissao::Permitida\n            } else {\n                MrdeskPermissao::Bloqueada\n            }\n        }\n        None => {\n            if crate::hbbs_http::sync::mrdesk_tecnico_na_lista(peer_id) {\n                log::info!("MrDesk: servidor sem resposta, tecnico {} autorizado pela lista guardada", peer_id);\n                MrdeskPermissao::Permitida\n            } else {\n                MrdeskPermissao::Falha\n            }\n        }\n    }\n}\n'
          p.write_text(s)
          print("connection.rs patched: controle de tecnicos autorizados (6A)")

          # 10) (Item 23) Lista de tecnicos guardada no MrDesk (src/hbbs_http/sync.rs):
          #     funcoes da lista + atualizacao 1x por dia no laco do heartbeat.
          p = pathlib.Path("src/hbbs_http/sync.rs")
          s = p.read_text()
          target = '                if let Ok(s) = crate::post_request(url.clone(), v.to_string(), "").await {\n'
          if s.count(target) != 1:
              raise SystemExit(
                  "ERRO: envio do heartbeat nao encontrado em src/hbbs_http/sync.rs - "
                  "atualize o patch 10 em generator-windows.yml."
              )
          s = s.replace(target, "                mrdesk_atualizar_lista(false).await; // MrDesk custom (item 23)\n" + target, 1)
          s += '\n// ================================================================\n// MrDesk custom (item 23): lista de tecnicos autorizados guardada neste\n// computador, usada quando o servidor nao responde. Servidor devolve codigos\n// SHA-256 de "<ID deste MrDesk>:<ID do MrDeskPro>" (nao revelam os IDs).\n// Atualiza 1x por dia (heartbeat) e a cada acesso; vale 15 dias.\n// ================================================================\nconst MRDESK_LISTA_CHAVE: &str = "mrdesk-tec-lista";\nconst MRDESK_LISTA_VALIDADE: u64 = 15 * 24 * 3600;\nconst MRDESK_LISTA_INTERVALO: u64 = 24 * 3600;\n\nfn mrdesk_agora() -> u64 {\n    std::time::SystemTime::now()\n        .duration_since(std::time::UNIX_EPOCH)\n        .map(|d| d.as_secs())\n        .unwrap_or(0)\n}\n\nfn mrdesk_lista_salva() -> (u64, Vec<String>) {\n    let v: Value = serde_json::from_str(&LocalConfig::get_option(MRDESK_LISTA_CHAVE)).unwrap_or(Value::Null);\n    let ts = v.get("ts").and_then(|x| x.as_u64()).unwrap_or(0);\n    let lista = v\n        .get("lista")\n        .and_then(|x| x.as_array())\n        .map(|a| a.iter().filter_map(|i| i.as_str().map(|s| s.to_owned())).collect())\n        .unwrap_or_default();\n    (ts, lista)\n}\n\npub async fn mrdesk_atualizar_lista(forcar: bool) {\n    let (ts, _) = mrdesk_lista_salva();\n    if !forcar && mrdesk_agora().saturating_sub(ts) < MRDESK_LISTA_INTERVALO {\n        return;\n    }\n    let base = crate::get_api_server(\n        Config::get_option("api-server"),\n        Config::get_option("custom-rendezvous-server"),\n    );\n    if base.is_empty() {\n        return;\n    }\n    let url = format!("{}/api/tecnicos/lista", base);\n    let body = json!({ "id": Config::get_id() }).to_string();\n    if let Ok(Ok(texto)) = tokio::time::timeout(Duration::from_secs(5), crate::post_request(url, body, "")).await {\n        if let Ok(v) = serde_json::from_str::<Value>(&texto) {\n            if let Some(lista) = v.get("lista").and_then(|x| x.as_array()) {\n                let salvar = json!({ "ts": mrdesk_agora(), "lista": lista });\n                LocalConfig::set_option(MRDESK_LISTA_CHAVE.to_owned(), salvar.to_string());\n            }\n        }\n    }\n}\n\npub fn mrdesk_tecnico_na_lista(peer_id: &str) -> bool {\n    use sha2::{Digest, Sha256};\n    let (ts, lista) = mrdesk_lista_salva();\n    if ts == 0 || mrdesk_agora().saturating_sub(ts) >= MRDESK_LISTA_VALIDADE {\n        return false;\n    }\n    let mut h = Sha256::new();\n    h.update(format!("{}:{}", Config::get_id(), peer_id).as_bytes());\n    let codigo: String = h.finalize().iter().map(|b| format!("{:02x}", b)).collect();\n    lista.iter().any(|x| x == &codigo)\n}\n'
          p.write_text(s)
          print("sync.rs patched: lista de tecnicos guardada (item 23)")

          # 9) Versao propria do MrDesk (decisao do Celso em 30/09/2026). Melhoria nossa
          #    sem versao nova do RustDesk nao chegava aos clientes pela atualizacao
          #    automatica (versao igual). A cada build que deva ser distribuido, aumentar
          #    o ULTIMO numero de MRDESK_VERSAO (1.4.10, 1.4.11, ...). Vai pro exe
          #    (ProductVersion, que o servidor le), pro crate::VERSION (que o cliente
          #    compara) e pro Flutter. Ao trocar a versao do RustDesk, conferir BASE.
          MRDESK_BASE = "1.4.9"
          MRDESK_VERSAO = "1.4.10"
          import re
          p = pathlib.Path("Cargo.toml")
          s = p.read_text()
          if not re.search(r'^version = "' + re.escape(MRDESK_BASE) + '"$', s, re.M):
              raise SystemExit(
                  "ERRO: versao do RustDesk diferente de " + MRDESK_BASE + " - atualize "
                  "MRDESK_BASE e MRDESK_VERSAO (patch 9) em generator-windows.yml."
              )
          s = re.sub(r'^version = "' + re.escape(MRDESK_BASE) + '"$', 'version = "' + MRDESK_VERSAO + '"', s, count=1, flags=re.M)
          p.write_text(s)
          p = pathlib.Path("libs/portable/Cargo.toml")
          s = p.read_text()
          s, n = re.subn(r'^version = "' + re.escape(MRDESK_BASE) + '"$', 'version = "' + MRDESK_VERSAO + '"', s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit("ERRO: versao nao encontrada em libs/portable/Cargo.toml (patch 9).")
          p.write_text(s)
          p = pathlib.Path("Cargo.lock")
          s = p.read_text()
          for pacote in ("rustdesk", "rustdesk-portable-packer"):
              antes = 'name = "' + pacote + '"\nversion = "' + MRDESK_BASE + '"'
              if s.count(antes) != 1:
                  raise SystemExit("ERRO: pacote " + pacote + " " + MRDESK_BASE + " nao encontrado no Cargo.lock (patch 9).")
              s = s.replace(antes, 'name = "' + pacote + '"\nversion = "' + MRDESK_VERSAO + '"', 1)
          p.write_text(s)
          p = pathlib.Path("flutter/pubspec.yaml")
          s = p.read_text()
          s, n = re.subn(r'^version: ' + re.escape(MRDESK_BASE) + r'\+', 'version: ' + MRDESK_VERSAO + '+', s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit("ERRO: versao nao encontrada em flutter/pubspec.yaml (patch 9).")
          p.write_text(s)
          print("versao propria do MrDesk: " + MRDESK_VERSAO + " (RustDesk " + MRDESK_BASE + ")")
          PYEOF

          echo "Patches de update aplicados: URL + checagem manual (common.rs) + checagem automatica diaria (updater.rs) + card visivel no Flutter (desktop_home_page.dart) + checagem na interface (common.dart) + foco do teclado ao voltar pra janela (remote_page.dart) + tempo sem uso no heartbeat (sync.rs) + tecnicos autorizados (connection.rs) + lista guardada (sync.rs) + versao propria (Cargo/pubspec)"

      - name: change appname to custom
        if: env.appname != 'rustdesk'
        continue-on-error: true
        shell: bash
        run: |
          # ./Cargo.toml
          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|ProductName = "RustDesk"|ProductName = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ env.appname }}.exe"|' ./Cargo.toml
          # ./libs/portable/Cargo.toml
          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|ProductName = "RustDesk"|ProductName = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ env.appname }}.exe"|' ./libs/portable/Cargo.toml
          # ./libs/portable/src/main.rs
          sed -i -e 's|const APP_PREFIX: \&str = "rustdesk";|const APP_PREFIX: \&str = "${{ env.appname }}";|' ./libs/portable/src/main.rs
          # ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"RustDesk Remote Desktop"|"${{ env.appname }}"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|VALUE "InternalName", "rustdesk" "\0"|VALUE "InternalName", "${{ env.appname }}" "\0"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"rustdesk.exe"|"${{ env.filename }}"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"RustDesk"|"${{ env.appname }}"|' ./flutter/windows/runner/Runner.rc
          # ./src/lang/en.rs
