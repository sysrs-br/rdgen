          // ================================================================
          // MrDesk custom (item 6B, patch 18): cinco senhas permanentes, uma por numero
          // de acesso (1 a 5). O numero vem do servidor da Sysrs na consulta do tecnico.
          // Senha 1 = senha permanente normal. Senhas 2 a 5 = LocalConfig do servico,
          // chave "mrdesk-senha-N", valor "salt|resumo cifrado" (resumo = o mesmo h1
          // da senha permanente, calculado com o mesmo salt).
          // ================================================================
          lazy_static::lazy_static! {
              // conexao -> numero do acesso informado na consulta do tecnico
              static ref MRDESK_ACESSOS: Arc<Mutex<HashMap<i32, u8>>> = Default::default();
          }

          const MRDESK_SENHA_CHAVE: &str = "mrdesk-senha-";

          fn mrdesk_acesso_da_conexao(conn_id: i32) -> u8 {
              MRDESK_ACESSOS
                  .lock()
                  .unwrap()
                  .get(&conn_id)
                  .copied()
