          // Numero do acesso remoto em andamento, pra saber qual senha pode ser alterada:
          // "1" a "5"; "" = nenhum acesso autorizado (ou sem numero conhecido); "x" =
          // acessos de numeros diferentes ao mesmo tempo.
          pub fn mrdesk_acesso_senha() -> String {
              let ids: Vec<i32> = AUTHED_CONNS
                  .lock()
                  .unwrap()
                  .iter()
                  .map(|c| c.conn_id)
                  .collect();
              if ids.is_empty() {
                  return String::new();
              }
              let acessos = MRDESK_ACESSOS.lock().unwrap();
              let mut nums: Vec<u8> = Vec::new();
              for id in ids.iter() {
                  match acessos.get(id) {
                      Some(n) => nums.push(*n),
                      None => return String::new(),
                  }
              }
              nums.sort();
              nums.dedup();
              if nums.len() == 1 {
                  nums[0].to_string()
              } else {
                  "x".to_owned()
              }
          }

          fn mrdesk_senha_h1(acesso: u8, salt: &str) -> Option<Vec<u8>> {
              let salvo = hbb_common::config::LocalConfig::get_option(&format!(
                  "{}{}",
                  MRDESK_SENHA_CHAVE, acesso
              ));
              let (salt_salvo, cifrado) = salvo.split_once('|')?;
              // o MrDeskPro calcula com o salt que recebeu nesta conexao: tem de ser o mesmo
              if salt_salvo.is_empty() || salt_salvo != salt {
                  return None;
              }
              let (hexa, ok, _) = hbb_common::password_security::decrypt_str_or_original(cifrado, "00");
              if !ok || hexa.len() != 64 {
                  return None;
              }
              let mut h1 = Vec::with_capacity(32);
              for i in (0..64).step_by(2) {
                  h1.push(u8::from_str_radix(hexa.get(i..i + 2)?, 16).ok()?);
              }
              Some(h1)
          }

          // A senha do acesso em andamento esta definida? (usado pela tela)
          pub fn mrdesk_tem_senha() -> bool {
              match mrdesk_acesso_senha().parse::<u8>() {
                  Ok(n) if n >= 2 => {
                      mrdesk_senha_h1(n, &Config::get_effective_permanent_password_salt()).is_some()
                  }
                  _ => Config::has_permanent_password(),
              }
          }

          // Grava (ou apaga, se vazia) a senha permanente do acesso em andamento.
          // Sem acesso remoto autorizado, ou com acessos de numeros diferentes: recusa.
          pub fn mrdesk_definir_senha(senha: &str) -> bool {
              let acesso = match mrdesk_acesso_senha().parse::<u8>() {
                  Ok(n) if (1..=5).contains(&n) => n,
                  _ => {
                      log::warn!("MrDesk: alteracao da senha permanente recusada (sem acesso remoto de um unico numero)");
                      return false;
                  }
              };
              if acesso == 1 {
                  return Config::set_permanent_password(senha);
              }
              let chave = format!("{}{}", MRDESK_SENHA_CHAVE, acesso);
              if senha.is_empty() {
                  hbb_common::config::LocalConfig::set_option(chave, String::new());
                  log::info!("MrDesk: senha permanente {} removida", acesso);
                  return true;
              }
              let salt = Config::get_effective_permanent_password_salt();
              if salt.is_empty() {
                  return false;
              }
              let h1 = hbb_common::config::compute_permanent_password_h1(senha, &salt);
              let hexa: String = h1.iter().map(|b| format!("{:02x}", b)).collect();
              let cifrado = hbb_common::password_security::encrypt_str_or_original(&hexa, "00", 128);
              if cifrado.is_empty() || cifrado == hexa {
                  log::warn!("MrDesk: nao foi possivel cifrar a senha permanente {}", acesso);
                  return false;
              }
              hbb_common::config::LocalConfig::set_option(chave, format!("{}|{}", salt, cifrado));
              log::info!("MrDesk: senha permanente {} definida", acesso);
              true
          }
