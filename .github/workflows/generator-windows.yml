          s += '\n// ================================================================\n// MrDesk custom (item 6A + 23): controle de tecnicos autorizados.\n// Antes de validar a senha, pergunta ao servidor da Sysrs se o ID de quem\n// esta conectando (MrDeskPro) esta autorizado. Se o servidor nao responder,\n// usa a lista de tecnicos guardada neste computador (item 23, atualizada 1x por\n// dia e a cada acesso; vale 15 dias) - ver hbbs_http/sync.rs.\n// ================================================================\nenum MrdeskPermissao {\n    Permitida,\n    Bloqueada,\n    Falha,\n}\n\nconst MRDESK_MSG_BLOQUEADA: &str = "Conex\\u{e3}o n\\u{e3}o permitida por regras de seguran\\u{e7}a da Sysrs.";\nconst MRDESK_MSG_FALHA: &str = "N\\u{e3}o foi poss\\u{ed}vel verificar a autoriza\\u{e7}\\u{e3}o: servidor da Sysrs fora do ar. Tente novamente em instantes.";\n\nasync fn mrdesk_verificar_tecnico(peer_id: &str) -> MrdeskPermissao {\n    let base = crate::get_api_server(\n        Config::get_option("api-server"),\n        Config::get_option("custom-rendezvous-server"),\n    );\n    let mut resposta: Option<bool> = None;\n    if !base.is_empty() {\n        let url = format!("{}/api/tecnicos/verificar", base);\n        let body = json!({ "id": Config::get_id(), "peer": peer_id }).to_string();\n        if let Ok(Ok(texto)) = hbb_common::tokio::time::timeout(\n            std::time::Duration::from_secs(5),\n            crate::post_request(url, body, ""),\n        )\n        .await\n        {\n            resposta = serde_json::from_str::<Value>(&texto)\n                .ok()\n                .and_then(|v| v.get("autorizado").and_then(|a| a.as_bool()));\n        }\n    }\n    match resposta {\n        Some(autorizado) => {\n            // servidor no ar: aproveita e renova a lista guardada (em segundo plano)\n            hbb_common::tokio::spawn(crate::hbbs_http::sync::mrdesk_atualizar_lista(true));\n            if autorizado {\n                MrdeskPermissao::Permitida\n  