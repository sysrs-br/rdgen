              if ts == 0 || mrdesk_agora().saturating_sub(ts) >= MRDESK_LISTA_VALIDADE {
                  return None;
              }
              let codigo = |texto: String| -> String {
                  let mut h = Sha256::new();
                  h.update(texto.as_bytes());
                  h.finalize().iter().map(|b| format!("{:02x}", b)).collect()
              };
              for n in 1..=5u8 {
                  let c = codigo(format!("{}:{}:{}", Config::get_id(), peer_id, n));
                  if lista.iter().any(|x| x == &c) {
                      return Some(n);
                  }
              }
              let c = codigo(format!("{}:{}", Config::get_id(), peer_id));
              if lista.iter().any(|x| x == &c) {
                  return Some(1);
              }
              None
          }
          ''' + s[j + len(fim):]
          p.write_text(s)

          # servico: alterar/consultar a senha passa pelas funcoes do patch
