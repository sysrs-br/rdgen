          fim = "    lista.iter().any(|x| x == &codigo)\n}\n"
          j = s.find(fim, i)
          if i < 0 or j < 0:
              raise SystemExit("ERRO: mrdesk_tecnico_na_lista nao encontrada em src/hbbs_http/sync.rs - atualize o patch 18.")
