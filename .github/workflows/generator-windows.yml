name: Custom Windows Client Generator
run-name: Custom Windows Client Generator
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'version to buld'
        required: true
        default: ''
        type: string
      zip_url:
        description: 'url to zip of json'
        required: true
        default: ''
        type: string


env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5" 
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2024.07.12
  VCPKG_COMMIT_ID: "${{ inputs.version == 'master' && '9e593bb18ea69cc5095e012465dcd675a822ed0d' || '120deac3062162151622ca4860575a33844ba10b' }}"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  VERSION: "${{ inputs.version }}"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"
  STATUS_URL: "${{ secrets.GENURL }}/updategh"


jobs:
  setup:
    uses: ./.github/workflows/fetch-encrypted-secrets.yml
    with:
      zip_url_json: ${{ inputs.zip_url }}

  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ inputs.version }}

  build-RustDeskTempTopMostWindow:
    needs: setup
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    secrets: inherit
    strategy:
      fail-fast: false

  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge, setup]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              vcpkg-triplet: x64-windows-static,
            }
          # - { target: aarch64-pc-windows-msvc, os: windows-2022, arch: aarch64 }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - uses: actions/download-artifact@v4
        with:
          name: encrypted-secrets-zip

      - name: Load Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}

      - name: Finalize and Cleanup zip/json
        if: always() # Run even if previous steps fail
        continue-on-error: true
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ secrets.GENURL }}/cleanzip"
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json"}'
          data: '{"uuid": "${{ env.uuid }}"}'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      
      - name: Set rdgen value
        if: ${{ env.rdgen == 'true' }}
        run: |
          echo "STATUS_URL=${{ secrets.GENURL }}/updategh" >> $env:GITHUB_ENV

      - name: Set rdgen value
        if: ${{ env.rdgen == 'false' }}
        run: |
          echo "STATUS_URL=${{ env.apiServer }}/api/updategh" >> $env:GITHUB_ENV

      - name: Checkout source code
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Checkout source code
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Set time zone to Brasilia (MrDesk custom - build date in local time)
        shell: cmd
        run: |
          rem A "Data da Build" do programa vem do relogio local da maquina que compila
          rem (chrono::Local em libs/hbb_common). O runner do GitHub fica em UTC e a
          rem data saia 3 horas adiantada.
          tzutil /s "E. South America Standard Time"
          tzutil /g

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: fix flutter_gpu_texture_renderer (fixed in master rustdesk)
        shell: bash
        run: |
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml

      - name: patch common.rs to report install status in sysinfo (MrDesk custom)
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("src/common.rs")
          s = p.read_text()
          old = (
              '    #[cfg(not(any(target_os = "android", target_os = "ios")))]\n'
              '    {\n'
              '        let username = crate::platform::get_active_username();\n'
              '        if !username.is_empty() && (!cfg!(windows) || username != "SYSTEM") {\n'
              '            out["username"] = json!(username);\n'
              '        }\n'
              '    }\n'
              '    out\n'
              '}'
          )
          new = (
              '    #[cfg(not(any(target_os = "android", target_os = "ios")))]\n'
              '    {\n'
              '        let username = crate::platform::get_active_username();\n'
              '        if !username.is_empty() && (!cfg!(windows) || username != "SYSTEM") {\n'
              '            out["username"] = json!(username);\n'
              '        }\n'
              '        out["installed"] = json!(if crate::platform::is_installed() { "S" } else { "N" });\n'
              '    }\n'
              '    out\n'
              '}'
          )
          if old not in s:
              raise SystemExit(
                  "ERRO: bloco esperado nao encontrado em src/common.rs - "
                  "o RustDesk oficial pode ter mudado essa funcao (get_sysinfo). "
                  "Atualize o patch em generator-windows.yml."
              )
          s = s.replace(old, new, 1)
          p.write_text(s)
          print("common.rs patched: campo 'installed' adicionado ao get_sysinfo()")
          PYEOF

      - name: patch windows.rs to set service description (MrDesk custom)
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("src/platform/windows.rs")
          s = p.read_text()

          # Localiza pela funcao (nao pelo bloco inteiro, que tem escaping
          # aninhado demais pra manter em um literal old/new) e insere a
          # linha "sc description" logo antes do "sc start" que pertence a
          # essa funcao especificamente (ha outro "sc start {app_name}" em
          # get_import_config, mais acima no arquivo).
          fn_marker = "fn get_create_service(exe: &str) -> String {"
          fn_idx = s.find(fn_marker)
          if fn_idx == -1:
              raise SystemExit(
                  "ERRO: funcao get_create_service nao encontrada em src/platform/windows.rs - "
                  "o RustDesk oficial pode ter mudado essa funcao. Atualize o patch em generator-windows.yml."
              )

          target = "sc start {app_name}"
          target_idx = s.find(target, fn_idx)
          if target_idx == -1:
              raise SystemExit(
                  "ERRO: linha 'sc start {app_name}' nao encontrada dentro de get_create_service - "
                  "o RustDesk oficial pode ter mudado essa funcao. Atualize o patch em generator-windows.yml."
              )

          insertion = (
              'sc description {app_name} \\"Suporte remoto Sysrs para atualizacao do Sistema '
              'de Gestao Empresarial MR1/MRE\\"\n'
          )
          s = s[:target_idx] + insertion + s[target_idx:]
          p.write_text(s)
          print("windows.rs patched: 'sc description' adicionado ao get_create_service()")
          PYEOF

      - name: patch windows.rs - service recovery and keep delayed start (MrDesk custom, patch 20)
        shell: bash
        run: |
          python3 - <<'PYEOF'
          # Patch 20 (06/10/2026, pedido do Celso): servico do MrDesk no Windows.
          #  a) Reinicio automatico se o servico cair: 5 tentativas com 1 minuto
          #     de intervalo, depois para ("sc failure"). Aplicado ao criar o servico (instalar)
          #     e tambem na atualizacao automatica (update_me), pra chegar nas
          #     maquinas ja instaladas.
          #  b) Maquina lenta em que o inicio do servico foi posto a mao em
          #     "automatico (atrasado)" ("sc config MrDesk start= delayed-auto"):
          #     reinstalar por cima apaga e recria o servico e perdia o ajuste.
          #     Agora o instalador ve o ajuste antes de apagar e reaplica depois de
          #     criar. A atualizacao automatica nao recria o servico (so para,
          #     troca os arquivos e inicia), entao la o ajuste ja era mantido.
          # O padrao continua "automatico" (sem atraso) pra todo mundo.
          import pathlib
          p = pathlib.Path("src/platform/windows.rs")
          s = p.read_text()

          def erro(o_que):
              raise SystemExit(
                  "ERRO: " + o_que + " nao encontrado em src/platform/windows.rs (patch 20) - "
                  "o RustDesk oficial pode ter mudado. Atualize o patch em generator-windows.yml."
              )

          # 5 tentativas com 1 minuto de intervalo e para: a 6a acao e "nenhuma"
          # (""), senao o Windows repetiria a ultima pra sempre. A contagem zera
          # depois de 1 dia sem falha (reset= 86400).
          falha = (
              "sc failure {app_name} reset= 86400 actions= "
              "restart/60000/restart/60000/restart/60000/restart/60000/restart/60000/"
              r'\"\"/0'
              "\n"
          )

          # 1) antes de apagar o servico (instalar por cima / desinstalar): guarda
          #    se o inicio estava em "atrasado"
          fn_idx = s.find("fn get_before_uninstall(kill_self: bool) -> String {")
          if fn_idx == -1:
              erro("funcao get_before_uninstall")
          alvo = "    sc stop {app_name}\n    sc delete {app_name}\n"
          i = s.find(alvo, fn_idx)
          if i == -1 or i - fn_idx > 1200:
              erro("'sc stop' + 'sc delete' em get_before_uninstall")
          guarda = (
              "    set MRDESK_ATRASADO=\n"
              r'    reg query HKLM\\SYSTEM\\CurrentControlSet\\Services\\{app_name} /v DelayedAutostart 2>nul | findstr /C:\"0x1\" >nul && set MRDESK_ATRASADO=1'
              "\n"
          )
          s = s[:i] + guarda + s[i:]

          # 2) ao criar o servico: reinicio em caso de falha e, se estava em
          #    "atrasado", volta a ficar
          fn_idx = s.find("fn get_create_service(exe: &str) -> String {")
          if fn_idx == -1:
              erro("funcao get_create_service")
          alvo = "sc start {app_name}"
          i = s.find(alvo, fn_idx)
          if i == -1 or i - fn_idx > 1500:
              erro("'sc start' em get_create_service")
          s = s[:i] + falha + "if defined MRDESK_ATRASADO sc config {app_name} start= delayed-auto\n" + s[i:]

          # 3) atualizacao automatica: aplica o reinicio em caso de falha nas
          #    maquinas ja instaladas (o servico nao e recriado aqui)
          fn_idx = s.find("pub fn update_me(debug: bool) -> ResultType<()> {")
          if fn_idx == -1:
              erro("funcao update_me")
          alvo = "{remove_meta_toml}\n{restore_service_cmd}\n"
          i = s.find(alvo, fn_idx)
          if i == -1:
              erro("'{remove_meta_toml}' + '{restore_service_cmd}' em update_me")
          i += len("{remove_meta_toml}\n")
          s = s[:i] + falha + s[i:]

          p.write_text(s)
          print("windows.rs patched: reinicio do servico em caso de falha e inicio atrasado mantido (patch 20)")
          PYEOF

      - name: patch ui_cm_interface.rs to allow Elevate even when installed as service (MrDesk custom - TESTE)
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("src/ui_cm_interface.rs")
          s = p.read_text()

          # can_elevate() normalmente retorna "!is_installed()", ou seja, o botao
          # "Elevate" da janela de Permissoes so funciona em modo portatil (nao
          # instalado). No MrDesk (instalado como servico), isso bloqueia o
          # unico caminho nativo do RustDesk pra alcancar janelas elevadas
          # (como a propria tela de Configuracoes) durante uma sessao remota.
          # Este patch faz can_elevate() sempre retornar true no Windows,
          # independente de estar instalado - EM TESTE, a confirmar se resolve
          # o problema de acesso as Configuracoes remotamente.
          fn_marker = "pub fn can_elevate() -> bool {"
          fn_idx = s.find(fn_marker)
          if fn_idx == -1:
              raise SystemExit(
                  "ERRO: funcao can_elevate nao encontrada em src/ui_cm_interface.rs - "
                  "o RustDesk oficial pode ter mudado essa funcao. Atualize o patch em generator-windows.yml."
              )

          target = "return !crate::platform::is_installed();"
          target_idx = s.find(target, fn_idx)
          if target_idx == -1:
              raise SystemExit(
                  "ERRO: linha 'return !crate::platform::is_installed();' nao encontrada dentro de can_elevate - "
                  "o RustDesk oficial pode ter mudado essa funcao. Atualize o patch em generator-windows.yml."
              )

          insertion = "return true; // MrDesk custom: permite Elevate mesmo instalado como servico\n    "
          s = s[:target_idx] + insertion + s[target_idx + len(target):]
          p.write_text(s)
          print("ui_cm_interface.rs patched: can_elevate() sempre retorna true no Windows")
          PYEOF

      - name: patch native software-update check to use MrDesk's own server (MrDesk custom)
        shell: bash
        run: |
          # O RustDesk original manda um POST fixo pra https://api.rustdesk.com/version/latest
          # pra saber se ha uma versao nova, e essa checagem inteira e desligada de proposito
          # para builds "custom client" como o MrDesk (is_custom_client() == true). Aqui a
          # gente: (1) troca a URL fixa pelo nosso proprio endpoint, e (2) reativa a checagem
          # (manual e a automatica diaria em segundo plano) especificamente pro MrDesk. O
          # endpoint (mrdesk-suporte /api/version/latest) e quem decide se ha versao nova.
          set -e

          python3 - <<'PYEOF'
          import pathlib

          # 1) URL fixa do check -> nosso servidor
          p = pathlib.Path("libs/hbb_common/src/lib.rs")
          s = p.read_text()
          target = 'const URL: &str = "https://api.rustdesk.com/version/latest";'
          if target not in s:
              raise SystemExit(
                  "ERRO: URL de version_check_request nao encontrada em libs/hbb_common/src/lib.rs - "
                  "o RustDesk oficial pode ter mudado essa funcao. Atualize o patch em generator-windows.yml."
              )
          s = s.replace(target, 'const URL: &str = "https://mrdesk.sysrs.com.br/api/version/latest";', 1)
          p.write_text(s)
          print("hbb_common/src/lib.rs patched: URL do version check aponta pro nosso servidor")

          # 2) Reativa a checagem manual (desligada de proposito pra custom client)
          p = pathlib.Path("src/common.rs")
          s = p.read_text()
          target = "pub fn check_software_update() {\n    if is_custom_client() {\n        return;\n    }"
          if target not in s:
              raise SystemExit(
                  "ERRO: guarda is_custom_client() em check_software_update() nao encontrada em src/common.rs - "
                  "o RustDesk oficial pode ter mudado essa funcao. Atualize o patch em generator-windows.yml."
              )
          replacement = "pub fn check_software_update() {\n    // MrDesk custom: checagem reativada, aponta pro nosso proprio servidor."
          s = s.replace(target, replacement, 1)
          p.write_text(s)
          print("common.rs patched: check_software_update() reativado para o MrDesk")

          # 3) Reativa a checagem automatica diaria em segundo plano (Windows)
          p = pathlib.Path("src/updater.rs")
          s = p.read_text()
          target = "let update_msi = crate::platform::is_msi_installed()? && !crate::is_custom_client();"
          if target not in s:
              raise SystemExit(
                  "ERRO: linha 'update_msi' nao encontrada em src/updater.rs - "
                  "o RustDesk oficial pode ter mudado essa funcao. Atualize o patch em generator-windows.yml."
              )
          replacement = "let update_msi = crate::platform::is_msi_installed()?; // MrDesk custom: checagem automatica diaria reativada"
          s = s.replace(target, replacement, 1)
          p.write_text(s)
          print("updater.rs patched: checagem automatica diaria reativada para o MrDesk")

          # 4) A tela principal do Flutter tem seu PROPRIO bloqueio pra esconder o card de
          #    "nova versao disponivel" quando e um "custom client" (bind.isCustomClient())
          #    OU quando o prefixo de URI do app (ex.: "mrdesk://") nao contem "rustdesk".
          #    Sem tirar esse bloqueio, o card nunca aparece pro MrDesk mesmo com o
          #    servidor respondendo certinho.
          p = pathlib.Path("flutter/lib/desktop/pages/desktop_home_page.dart")
          s = p.read_text()
          target = (
              "if (!bind.isCustomClient() &&\n"
              "        updateUrl.isNotEmpty &&\n"
              "        !isCardClosed &&\n"
              "        bind.mainUriPrefixSync().contains('rustdesk')) {"
          )
          if target not in s:
              raise SystemExit(
                  "ERRO: condicao do card 'nova versao disponivel' nao encontrada em "
                  "flutter/lib/desktop/pages/desktop_home_page.dart - o RustDesk oficial pode ter "
                  "mudado essa tela. Atualize o patch em generator-windows.yml."
              )
          replacement = "if (updateUrl.isNotEmpty && !isCardClosed) { // MrDesk custom: card de update habilitado"
          s = s.replace(target, replacement, 1)
          p.write_text(s)
          print("desktop_home_page.dart patched: card de nova versao habilitado para custom client")

          # 5) Na inicializacao da interface, checkUpdate() (flutter/lib/common.dart) so
          #    registra o evento que preenche stateGlobal.updateUrl, e so pede a checagem
          #    ao Rust, quando NAO e custom client. Sem tirar essa trava, a tela nunca
          #    pergunta nada ao servidor e o card do item 4 fica sempre vazio (a checagem
          #    que aparece no log vem so do atualizador em segundo plano do servico).
          p = pathlib.Path("flutter/lib/common.dart")
          s = p.read_text()
          target = (
              "void checkUpdate() {\n"
              "  if (!isWeb) {\n"
              "    if (!bind.isCustomClient()) {"
          )
          if target not in s:
              raise SystemExit(
                  "ERRO: trava isCustomClient() em checkUpdate() nao encontrada em "
                  "flutter/lib/common.dart - o RustDesk oficial pode ter mudado essa funcao. "
                  "Atualize o patch em generator-windows.yml."
              )
          replacement = (
              "void checkUpdate() {\n"
              "  if (!isWeb) {\n"
              "    if (true) { // MrDesk custom: checagem de update na interface habilitada"
          )
          s = s.replace(target, replacement, 1)
          p.write_text(s)
          print("common.dart patched: checkUpdate() da interface habilitado para custom client")

          # 6) (Item 19) Foco do teclado ao voltar pra janela da sessao (Alt+Tab, barra de
          #    tarefas...). No Windows, onWindowBlur() tira o foco do teclado da tela remota,
          #    mas onWindowFocus() so devolve no "modo de mouse relativo" - no uso normal o
          #    teclado so voltava depois de clicar dentro da tela remota. Aqui devolvemos o
          #    foco ao voltar pra janela, so na aba visivel (varias sessoes em abas).
          p = pathlib.Path("flutter/lib/desktop/pages/remote_page.dart")
          s = p.read_text()
          target = (
              "    stateGlobal.isFocused.value = true;\n"
              "\n"
              "    // Restore relative mouse mode constraints when window regains focus.\n"
          )
          if s.count(target) != 1:
              raise SystemExit(
                  "ERRO: trecho de onWindowFocus() nao encontrado em "
                  "flutter/lib/desktop/pages/remote_page.dart - o RustDesk oficial pode ter "
                  "mudado essa funcao. Atualize o patch 6 em generator-windows.yml."
              )
          replacement = (
              "    stateGlobal.isFocused.value = true;\n"
              "\n"
              "    // MrDesk custom: devolve o teclado para a tela remota ao voltar para a janela\n"
              "    if (isWindows && !_rawKeyFocusNode.hasFocus) {\n"
              "      final mrdeskTabs = widget.tabController?.state.value;\n"
              "      final mrdeskAbaVisivel = mrdeskTabs == null ||\n"
              "          mrdeskTabs.tabs.isEmpty ||\n"
              "          mrdeskTabs.selected >= mrdeskTabs.tabs.length ||\n"
              "          mrdeskTabs.selectedTabInfo.key == widget.id;\n"
              "      if (mrdeskAbaVisivel) {\n"
              "        _rawKeyFocusNode.requestFocus();\n"
              "      }\n"
              "    }\n"
              "\n"
              "    // Restore relative mouse mode constraints when window regains focus.\n"
          )
          s = s.replace(target, replacement, 1)
          p.write_text(s)
          print("remote_page.dart patched: foco do teclado volta pra tela remota ao ativar a janela")

          # 7) (Item 16) Junto com o heartbeat (a cada ~15 s), manda ha quantos segundos o
          #    teclado/mouse estao parados ("mrdesk_ocioso"), pro painel mostrar
          #    "sem uso ha X min". GetLastInputInfo so vale na sessao do usuario - o
          #    heartbeat sai do processo --server, que o servico abre na sessao do usuario.
          #    Manda so o tempo parado, nada do que e digitado.
          p = pathlib.Path("src/hbbs_http/sync.rs")
          s = p.read_text()
          target = '                v["modified_at"] = json!(modified_at);\n'
          if s.count(target) != 1:
              raise SystemExit(
                  "ERRO: linha do heartbeat (modified_at) nao encontrada em "
                  "src/hbbs_http/sync.rs - o RustDesk oficial pode ter mudado o heartbeat. "
                  "Atualize o patch 7 em generator-windows.yml."
              )
          replacement = (
              target
              + "                // MrDesk custom (item 16): tempo sem uso de teclado/mouse\n"
              + "                #[cfg(windows)]\n"
              + "                {\n"
              + "                    if let Some(ocioso) = mrdesk_segundos_ocioso() {\n"
